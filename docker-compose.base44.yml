services:
  mongo:
    image: mongo:7
    restart: on-failure
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /app/backend
    volumes:
      - ./:/app
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://root:rootpass@mongo:27017/?authSource=admin
      - DB_NAME=appdb
      - CORS_ORIGINS=*
    depends_on:
      mongo:
        condition: service_healthy
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python -m uvicorn server:app --reload --host 0.0.0.0 --port 8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: node:22
    restart: on-failure
    working_dir: /app/frontend
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - DISABLE_EMERGENT_OVERLAY=true
      - CI=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "yarn install --frozen-lockfile || yarn install && exec yarn start"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  mongo_data:
