services:
  mongo:
    image: mongo:7
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: hearten
      MONGO_INITDB_ROOT_PASSWORD: heartenpass
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    env_file:
      # Non-secret defaults first; platform secrets LAST so they always win.
      - ./env.base44.defaults
      - /run/base44/app.env
    environment:
      MONGO_URL: mongodb://hearten:heartenpass@mongo:27017/hearten_db?authSource=admin
      DB_NAME: hearten_db
      CORS_ORIGINS: "*"
    depends_on:
      mongo:
        condition: service_healthy
    command: ["sh", "-ec", "pip install --no-cache-dir fastapi==0.110.1 'uvicorn[standard]==0.25.0' 'python-dotenv>=1.0.1' 'pymongo==4.6.3' 'pydantic>=2.6.4' 'motor==3.3.1' 'httpx>=0.27.0' && exec uvicorn server:app --host 0.0.0.0 --port 8000 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: node:22-slim
    restart: on-failure
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      DISABLE_EMERGENT_OVERLAY: "true"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${BASE44_PUBLIC_HOST_SUFFIX}"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    command: ["sh", "-ec", "yarn install && exec yarn start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  mongo_data:
