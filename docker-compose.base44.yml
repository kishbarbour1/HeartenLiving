services:
  # ── Contact-form API (Node.js serverless function, dev server) ──────────
  # In production this is deployed as a Base44 Function — see DEPLOYMENT.md.
  # The dev server here lets the frontend's CRA proxy reach /api/contact.
  api:
    image: node:22-slim
    restart: on-failure
    working_dir: /app/functions
    volumes:
      - ./functions:/app/functions
    env_file:
      # Non-secret defaults first; platform secrets LAST so they always win.
      - ./env.base44.defaults
      - /run/base44/app.env
    environment:
      PORT: "8000"
      CORS_ORIGINS: "*"
    command: ["sh", "-ec", "npm install --omit=dev && exec npm run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (React + CRACO dev server) ─────────────────────────────────
  frontend:
    image: node:22-slim
    restart: on-failure
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      DISABLE_EMERGENT_OVERLAY: "true"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${BASE44_PUBLIC_HOST_SUFFIX}"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-ec", "yarn install && exec yarn start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>r.ok?0:1).catch(()=>1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
