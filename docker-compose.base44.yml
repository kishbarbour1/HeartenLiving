services:
  # ── Contact-form API (Deno — matches the Base44 function runtime) ────────
  # Production deploys `base44/functions/contact/` as a Base44 Function.
  # Locally, `base44/dev-server.ts` runs the SAME handler on Deno so behaviour
  # matches production. The frontend's CRA proxy reaches /api/contact here.
  api:
    image: denoland/deno:latest
    restart: on-failure
    working_dir: /app
    volumes:
      - ./base44:/app/base44
    env_file:
      # Non-secret defaults first; platform secrets LAST so they always win.
      - ./env.base44.defaults
      - /run/base44/app.env
    environment:
      PORT: "8000"
    command: ["run", "--allow-net", "--allow-env", "--allow-read", "base44/dev-server.ts"]
    healthcheck:
      test: ["CMD", "deno", "eval", "--allow-net", "const r = await fetch('http://localhost:8000/api'); Deno.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Frontend (React + CRACO dev server) ─────────────────────────────────
  frontend:
    image: node:22-slim
    restart: on-failure
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      DISABLE_EMERGENT_OVERLAY: "true"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${BASE44_PUBLIC_HOST_SUFFIX}"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-ec", "yarn install && exec yarn start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>r.ok?0:1).catch(()=>1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
